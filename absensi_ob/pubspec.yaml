name: absensi_ob
description: "Aplikasi absensi karyawan OB dengan face recognition."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  image: ^4.1.7
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  camera: ^0.11.0+2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.2.0
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  google_mlkit_face_detection: 0.13.2
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/mobilefacenet.tflite
